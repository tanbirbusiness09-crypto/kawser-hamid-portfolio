name: Import Portfolio Images
on:
  push:
    branches: [main]
    paths: ["portfolio-assets.zip"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract approved image assets only
        run: |
          python3 - <<'PYCODE'
          import zipfile
          from pathlib import Path
          archive = Path('portfolio-assets.zip')
          if not archive.exists():
              raise SystemExit('ZIP not found')
          approved = {
            'assets/brand/company-logo.webp',
            'assets/photos/branch-opening.webp',
            'assets/photos/business-roadmap.webp',
            'assets/photos/executive-portrait.webp',
            'assets/photos/keynote.webp',
            'assets/photos/saudi-consultation.webp',
            'assets/photos/team-strategy.webp',
            'assets/photos/video-consultation.webp',
          }
          total = 0
          with zipfile.ZipFile(archive) as z:
              for member in z.infolist():
                  if member.filename not in approved:
                      continue
                  if member.file_size > 3_000_000:
                      raise SystemExit('Image exceeds size limit')
                  path = Path(member.filename)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(z.read(member))
                  total += 1
          if total != len(approved):
              raise SystemExit(f'Expected {len(approved)} images; found {total}')
          print(f'Imported {total} image assets')
          PYCODE
      - name: Commit imported assets and remove archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand/company-logo.webp assets/photos
          git rm -- portfolio-assets.zip
          git diff --cached --quiet || git commit -m "Import CEO images and remove upload archive"
          git push
